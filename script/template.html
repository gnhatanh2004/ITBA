<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3130" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#071514" media="(prefers-color-scheme: dark)">
<title>IT Business Analyst – Khóa học</title>
<style>
/*__FONTS__*/
:root{
  color-scheme:light;
  --font:'Be Vietnam Pro',system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --bg:oklch(97.4% .01 85);--surface:oklch(99.5% .004 85);--sunk:oklch(94.8% .013 85);
  --fg:oklch(24% .02 235);--muted:oklch(46% .02 235);--line:oklch(89.5% .013 85);--line-strong:oklch(80% .016 85);
  --primary:oklch(46% .09 185);--primary-hover:oklch(40% .09 185);--primary-fg:oklch(99% .005 185);--primary-soft:oklch(94% .03 185);
  --rail:oklch(28.5% .04 192);--rail-fg:oklch(95.5% .012 180);--rail-muted:oklch(77% .03 185);--rail-line:oklch(36% .04 192);
  --rail-hover:oklch(33% .045 192);--rail-active:oklch(38.5% .055 189);
  --mark:oklch(90% .12 92);--mark-fg:inherit;--mark-strong:oklch(78% .15 78);
  --ok:oklch(48% .12 150);--ok-bg:oklch(95.5% .04 150);--ok-line:oklch(76% .1 150);
  --bad:oklch(51% .17 27);--bad-bg:oklch(96% .028 27);--bad-line:oklch(80% .09 27);
  --note-bg:oklch(95.6% .022 230);--tip-bg:oklch(95.6% .032 165);--warn-bg:oklch(95.8% .05 85);
  --focus:oklch(63% .16 58);
  --shadow:0 1px 2px oklch(30% .02 235 / .06),0 6px 18px -6px oklch(30% .02 235 / .12);
  --shadow-lg:0 2px 4px oklch(30% .02 235 / .06),0 18px 40px -12px oklch(30% .02 235 / .22);
  --r:14px;--r-sm:9px;--ease:cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;
  --bg:oklch(18.5% .013 210);--surface:oklch(22.5% .015 210);--sunk:oklch(16.5% .012 210);
  --fg:oklch(93.5% .01 200);--muted:oklch(73% .016 200);--line:oklch(31% .016 210);--line-strong:oklch(41% .02 210);
  --primary:oklch(76% .1 183);--primary-hover:oklch(82% .1 183);--primary-fg:oklch(19% .03 195);--primary-soft:oklch(30% .045 190);
  --rail:oklch(14.8% .018 200);--rail-fg:oklch(93% .012 185);--rail-muted:oklch(70% .025 190);--rail-line:oklch(24% .025 200);
  --rail-hover:oklch(21% .03 195);--rail-active:oklch(26.5% .045 190);
  --mark:oklch(46% .09 85);--mark-fg:oklch(97% .02 90);--mark-strong:oklch(80% .14 82);
  --ok:oklch(78% .13 150);--ok-bg:oklch(27% .05 152);--ok-line:oklch(46% .09 150);
  --bad:oklch(76% .13 27);--bad-bg:oklch(28% .055 27);--bad-line:oklch(49% .11 27);
  --note-bg:oklch(26.5% .03 232);--tip-bg:oklch(26.5% .035 168);--warn-bg:oklch(28.5% .045 82);
  --focus:oklch(80% .15 75);
  --shadow:0 1px 2px oklch(0% 0 0 / .3),0 8px 20px -8px oklch(0% 0 0 / .45);
  --shadow-lg:0 2px 6px oklch(0% 0 0 / .35),0 24px 48px -16px oklch(0% 0 0 / .6);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-color:var(--line-strong) transparent;-webkit-tap-highlight-color:transparent}
button,.btn,.opt,.tabs a,a{touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16.5px/1.7 var(--font);font-feature-settings:"kern";-webkit-font-smoothing:antialiased;caret-color:var(--primary);accent-color:var(--primary)}
::selection{background:var(--mark);color:var(--mark-fg)}
a{color:var(--primary);text-underline-offset:.2em;text-decoration-thickness:1px}
a:hover{color:var(--primary-hover)}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px;border-radius:6px}
[tabindex="-1"]:focus{outline:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{line-height:1.3;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:clamp(1.6rem,1.2rem + 1.4vw,2.1rem);font-weight:700;margin:.15em 0 .35em;letter-spacing:-.025em}
h2{font-size:1.3rem;font-weight:700;margin:2em 0 .55em}
h3{font-size:1.08rem;font-weight:600;margin:1.5em 0 .4em}
p,li{text-wrap:pretty}
svg.i{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tnum,.pct,.pc,.timer{font-variant-numeric:tabular-nums}

/* ---------- khung ---------- */
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}
#side{background:var(--rail);color:var(--rail-fg);padding:20px 14px 48px;position:sticky;top:0;height:100vh;overflow-y:auto;font-size:14.5px;line-height:1.45;scrollbar-color:var(--rail-line) transparent}
#side a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r-sm);color:var(--rail-fg);text-decoration:none;transition:background .15s}
#side a[aria-current]{background:var(--rail-active);font-weight:600}
#side a[aria-current] .lid{background:var(--mark-strong);color:oklch(22% .03 80)}
#side .brand{display:block;padding:6px 10px 14px;margin-bottom:6px;border-bottom:1px solid var(--rail-line);border-radius:0}
#side .brand b{display:block;font-size:17px;line-height:1.3;letter-spacing:-.01em}
#side .brand small{display:block;color:var(--rail-muted);font-size:13px;margin-top:3px}
#side .brand[aria-current]{background:none}
#side .grp{margin:18px 10px 6px;font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--rail-muted)}
#side ul{list-style:none;margin:2px 0 8px;padding:0}
#side .mod{margin-top:4px}
#side .mod>a{font-weight:600;color:var(--rail-fg)}
#side .mid{font-size:12px;font-weight:700;color:var(--rail-muted);min-width:2.2em}
#side .lid{flex:none;font-size:11.5px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--rail-line);color:var(--rail-fg);min-width:3.3em;text-align:center}
#side .lt{flex:1;min-width:0}
#side .pc{flex:none;font-size:12px;color:var(--rail-muted)}
#side .pc.full{color:var(--mark-strong)}
#side .cnt{margin-left:auto;font-size:12px;font-weight:700;padding:0 7px;border-radius:99px;background:var(--rail-line)}
#side .cnt.hot{background:var(--mark-strong);color:oklch(22% .03 80)}
#side li.dim{padding:7px 10px;color:var(--rail-muted);font-style:italic}
main{padding:36px 48px calc(96px + env(safe-area-inset-bottom));min-width:0;overflow-wrap:break-word}
.wrap{max-width:860px;margin:0 auto}
.topbar,.scrim{display:none}
/* --top: chiều cao thanh trên cùng ở màn hẹp (8 + nút 42 + 8), cộng vùng tai thỏ */
:root{--sl:env(safe-area-inset-left);--sr:env(safe-area-inset-right);--top:calc(58px + env(safe-area-inset-top))}
@media (max-width:959px){
  .layout{display:block}
  .topbar{display:flex;align-items:center;gap:12px;padding:calc(8px + env(safe-area-inset-top)) calc(24px + var(--sr)) 8px calc(24px + var(--sl));background:var(--rail);color:var(--rail-fg);position:sticky;top:0;z-index:15}
  .topbar .btn{background:transparent;color:var(--rail-fg);border-color:var(--rail-line);flex:none;white-space:nowrap}
  .topbar b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
  #side{position:fixed;inset:0 auto 0 0;width:min(330px,88vw);z-index:30;padding:calc(20px + env(safe-area-inset-top)) 14px calc(48px + env(safe-area-inset-bottom)) calc(14px + var(--sl));height:100vh;height:100dvh;overscroll-behavior:contain;transform:translateX(-105%);visibility:hidden;transition:transform .25s var(--ease),visibility .25s}
  body.nav-open #side{transform:none;visibility:visible;box-shadow:var(--shadow-lg)}
  body.nav-open .scrim{display:block;position:fixed;inset:0;z-index:20;background:oklch(15% .02 200 / .45)}
  main{padding:28px calc(32px + var(--sr)) calc(80px + env(safe-area-inset-bottom)) calc(32px + var(--sl))}
}
@media (max-width:699px){
  .topbar{padding-left:calc(16px + var(--sl));padding-right:calc(16px + var(--sr))}
  main{padding:20px calc(16px + var(--sr)) calc(72px + env(safe-area-inset-bottom)) calc(16px + var(--sl))}
}
.muted{color:var(--muted)}
.small{font-size:14px}
.crumb{margin:0 0 2px;font-size:14px;color:var(--muted)}
.crumb a{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}

/* ---------- nút ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:8px 16px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);color:var(--fg);cursor:pointer;text-decoration:none;font-size:15px;font-weight:500;line-height:1.25;transition:background .15s,border-color .15s,transform .1s}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{background:var(--primary);color:var(--primary-fg);border-color:var(--primary);font-weight:600}
.btn[aria-pressed=true]{background:var(--primary-soft);border-color:var(--primary);font-weight:600}
.btn.ok{color:var(--ok);border-color:var(--ok-line)}
.btn.bad,.btn.danger{color:var(--bad);border-color:var(--bad-line)}
/* hover chỉ cho chuột: trên màn cảm ứng hover bị "kẹt" sau khi chạm */
@media (hover:hover){
  #side a:hover{background:var(--rail-hover)}
  .btn:hover:not(:disabled){border-color:var(--primary);color:var(--fg)}
  .topbar .btn:hover{color:var(--rail-fg)}
  .btn.primary:hover:not(:disabled){background:var(--primary-hover);border-color:var(--primary-hover);color:var(--primary-fg)}
  .btn.ok:hover:not(:disabled){background:var(--ok-bg);border-color:var(--ok)}
  .btn.bad:hover:not(:disabled),.btn.danger:hover:not(:disabled){background:var(--bad-bg);border-color:var(--bad)}
  .tools a:hover{border-color:var(--primary);box-shadow:var(--shadow);transform:translateY(-1px);color:var(--fg)}
  .chips a:hover{border-color:var(--primary)}
  .opt:hover:not(:disabled){border-color:var(--primary);background:color-mix(in oklch,var(--primary-soft) 40%,var(--surface))}
  .toc button:hover{background:var(--sunk)}
}
@media (hover:none){.btn.ok:active:not(:disabled){background:var(--ok-bg)}.btn.bad:active:not(:disabled){background:var(--bad-bg)}}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{border-color:transparent;background:transparent}

/* ---------- khối ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin:16px 0}
.card>h2:first-child,.card>h3:first-child{margin-top:0}
.tag{display:inline-flex;align-items:center;font-size:12.5px;font-weight:600;line-height:1.7;padding:0 9px;border-radius:99px;background:var(--sunk);color:var(--muted);vertical-align:middle;white-space:nowrap}
.tag.lv-apdung{background:var(--warn-bg);color:var(--fg)}
.lbl{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--muted)}
.src{font-size:13.5px;color:var(--muted);margin:12px 0 0}
.prog{display:flex;align-items:center;gap:12px}
.pbar{flex:1;height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;min-width:60px;box-shadow:inset 0 0 0 1px var(--line)}
.pbar span{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .6s var(--ease)}
.pct{font-size:14px;font-weight:600;min-width:3em;text-align:right}

/* trang chủ */
.hero{padding:8px 0 26px;border-bottom:1px solid var(--line);margin-bottom:8px}
.hero h1{font-size:clamp(1.8rem,1.3rem + 1.6vw,2.4rem);max-width:24ch;margin-bottom:.3em}
.hero h1 mark{background:linear-gradient(transparent 58%,var(--mark) 58%,var(--mark) 92%,transparent 92%);color:inherit;padding:0 .05em}
.hero .lead{font-size:1.08rem;color:var(--muted);max-width:60ch;margin:0 0 20px}
.hero .prog{max-width:520px;margin:0 0 20px}
.hero .stats{display:flex;flex-wrap:wrap;gap:6px 22px;margin:0 0 22px;padding:0;list-style:none;font-size:14.5px;color:var(--muted)}
.hero .stats b{color:var(--fg);font-size:1.05rem;margin-right:4px}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin:22px 0 6px}
.tools a{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:start;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-decoration:none;color:var(--fg);transition:border-color .15s,box-shadow .2s,transform .2s var(--ease)}
.tools svg.i{grid-row:span 2;width:22px;height:22px;margin-top:2px;color:var(--primary)}
.tools b{font-weight:600;font-size:15.5px}
.tools span{font-size:13.5px;color:var(--muted);line-height:1.45}
.road{list-style:none;margin:8px 0 0;padding:0;position:relative}
.road>li{position:relative;padding:0 0 26px 46px}
.road>li::before{content:"";position:absolute;left:15px;top:34px;bottom:0;width:2px;background:var(--line)}
.road>li:last-child::before{display:none}
.road .dot{position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:700;background:var(--surface);border:2px solid var(--line-strong);color:var(--muted)}
.road .dot.go{border-color:var(--primary);color:var(--primary)}
.road .dot.full{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.road h3{margin:3px 0 8px;font-size:1.08rem}
.road h3 a{color:var(--fg);text-decoration:none}
.road h3 a:hover{color:var(--primary)}
.road .prog{max-width:360px;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.chips a,.chips span{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border:1px solid var(--line);border-radius:99px;font-size:13.5px;text-decoration:none;color:var(--fg);background:var(--surface)}
.chips b{font-size:12px;color:var(--muted)}
.chips a.full b{color:var(--ok)}
.resume{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* trang bài */
.lhead{margin-bottom:6px}
.lhead h1 .lidb{display:inline-block;font-size:.55em;vertical-align:.3em;padding:2px 9px;border-radius:8px;background:var(--mark);color:var(--mark-fg);margin-right:6px;letter-spacing:0;font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;margin:0;font-size:14px;color:var(--muted)}
.tabs{display:flex;gap:2px;margin:20px 0 26px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;position:sticky;top:0;z-index:6;background:var(--bg)}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;display:inline-flex;align-items:center;gap:6px;padding:10px 9px 11px;text-decoration:none;color:var(--muted);font-size:14.5px;font-weight:500;border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a:hover{color:var(--fg)}
.tabs a[aria-current]{color:var(--fg);border-bottom-color:var(--primary);font-weight:600}
.tabs small{font-size:11.5px;font-weight:600;padding:0 6px;border-radius:99px;background:var(--sunk);color:var(--muted)}
@media (max-width:959px){.tabs{position:static}}

/* nội dung bài */
.prose>:first-child{margin-top:0}
.prose>:last-child{margin-bottom:0}
.prose p,.prose li{max-width:72ch}
.prose ul,.prose ol{padding-left:1.35em}
.prose li{margin:.3em 0}
.prose li::marker{color:var(--muted)}
.prose h4{font-size:1rem;margin:1.4em 0 .4em}
.prose h5{font-size:.95rem;margin:1.2em 0 .3em;color:var(--muted)}
.prose table{border-collapse:separate;border-spacing:0;width:100%;font-size:14.5px;line-height:1.55;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.prose th,.prose td{padding:8px 11px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.prose tr>:last-child{border-right:0}
.prose tbody tr:last-child>*,.prose table>tr:last-child>*{border-bottom:0}
.prose th{background:var(--sunk);font-weight:600}
.prose tbody tr:nth-child(even) td{background:color-mix(in oklch,var(--sunk) 45%,transparent)}
.tw{overflow-x:auto;margin:14px 0}
.prose pre{overflow-x:auto;background:var(--sunk);border:1px solid var(--line);padding:12px 14px;border-radius:var(--r-sm);font-size:13.5px;line-height:1.55}
.prose code{font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-size:.88em;background:var(--sunk);padding:.1em .35em;border-radius:5px}
.prose pre code{background:none;padding:0}
.prose blockquote{margin:14px 0;padding:10px 16px;background:var(--sunk);border-radius:var(--r-sm);color:var(--muted);font-style:italic}
.prose :is(p,div,ul,ol,blockquote).note,.prose :is(p,div,ul,ol,blockquote).tip,.prose :is(p,div,ul,ol,blockquote).warn,.prose div.key,.prose p.key{padding:12px 16px;border-radius:var(--r-sm);border:1px solid transparent}
.prose :is(p,div,ul,ol,blockquote).note{background:var(--note-bg);border-color:color-mix(in oklch,var(--note-bg) 70%,var(--fg) 12%)}
.prose :is(p,div,ul,ol,blockquote).tip{background:var(--tip-bg);border-color:color-mix(in oklch,var(--tip-bg) 70%,var(--fg) 12%)}
.prose :is(p,div,ul,ol,blockquote).warn{background:var(--warn-bg);border-color:color-mix(in oklch,var(--warn-bg) 70%,var(--fg) 14%)}
.prose div.key,.prose p.key{background:var(--warn-bg);font-weight:500}
.prose :is(ul,ol):is(.note,.tip,.warn,.key){padding-left:2.2em}
mark,span.key,b.key,strong.key,em.key{background:linear-gradient(transparent 12%,var(--mark) 12%,var(--mark) 90%,transparent 90%);color:var(--mark-fg);padding:0 .15em;border-radius:2px}
figure{margin:22px 0;text-align:center}
figure img{max-width:100%;height:auto;border-radius:var(--r-sm);border:1px solid var(--line);background:#fff;box-shadow:var(--shadow)}
figure.noimg img{display:none}
figcaption{font-size:13.5px;color:var(--muted);margin-top:8px}
.sec{padding-bottom:6px}
.sec+.sec{border-top:1px solid var(--line);margin-top:30px;padding-top:2px}
.sec>h2{margin-top:1.1em}
.ex{position:relative}
.ex .done-badge{display:none}
.ex.done .done-badge{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--ok);background:var(--ok-bg);padding:1px 9px;border-radius:99px;margin-left:8px;vertical-align:middle}
.ex.done{border-color:var(--ok-line)}
.hint,.answer{border-radius:var(--r-sm);padding:12px 16px;margin:12px 0}
.hint{background:var(--note-bg)}
.answer{background:var(--tip-bg)}
/* bài tập tương tác */
.lead-ex{display:flex;gap:8px;align-items:flex-start;font-weight:600;margin:18px 0 4px;color:var(--primary)}
.lead-ex svg.i{margin-top:.25em}
.part{margin:12px 0;padding:14px 16px 16px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg)}
.pq{margin:0 0 2px;font-weight:600}
.ptip{margin:0 0 10px;font-size:13.5px;color:var(--muted)}
.tx{white-space:pre-wrap;overflow-wrap:anywhere}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:58px;padding:10px;border:1.5px dashed var(--line-strong);border-radius:var(--r-sm);background:var(--sunk);transition:border-color .15s,background .15s}
.pool:not(:has(.chip))::after{content:"Đã xếp hết các mục.";color:var(--muted);font-size:14px;align-self:center;padding:0 4px}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px;margin-top:10px}
.bin{display:flex;flex-direction:column;border:1.5px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);padding:8px;min-height:88px;cursor:pointer;transition:border-color .15s,background .15s}
.bin .bl{margin:2px 4px 8px;font-size:13.5px;font-weight:700;color:var(--primary);line-height:1.35}
.bz{display:flex;flex-direction:column;gap:6px;flex:1}
.has-sel .bin,.has-sel .pool{border-color:var(--primary);border-style:dashed}
.bin.over,.pool.over{background:var(--primary-soft);border-color:var(--primary)}

.sc-pts li.on::before{background:var(--rail-muted)}

.sc-pts li.now span{background:linear-gradient(transparent 62%,color-mix(in oklch,var(--mark-strong) 42%,transparent) 62%,color-mix(in oklch,var(--mark-strong) 42%,transparent) 94%,transparent 94%)}

.cap{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 40px);margin:0;padding:6px 14px;border-radius:8px;background:oklch(10% .02 200 / .78);color:oklch(98% 0 0);font-size:15px;line-height:1.45;text-align:center;text-wrap:balance}

.cover{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;background:oklch(18% .03 195 / .72);backdrop-filter:blur(3px)}
.cover[hidden]{display:none}

  .pop-foot{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .pop-foot .btn{flex:1}
  /* flashcard: hàng 1 Chưa thuộc | Đã thuộc, hàng 2 ‹ Lật thẻ › */
  .fc-card{min-height:min(300px,46vh)}

}

}

}

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function isRight(q, chosen) {
  const a = q.answer || [];
  chosen = chosen || [];
  return chosen.length === a.length && a.every(x => chosen.indexOf(x) >= 0);
}
// sổ câu sai: S.wrong[id] = số lần đúng liên tiếp; đủ 2 thì rời sổ
function record(id, ok) {
  let note = "";
  if (ok) {
    S.ok[id] = 1; save("ok");
    if (id in S.wrong) {
      if (++S.wrong[id] >= 2) { delete S.wrong[id]; note = "Đúng 2 lần liên tiếp – câu này đã rời sổ câu sai."; }
      else note = "Đúng 1/2 lần liên tiếp để rời sổ câu sai.";
      save("wrong");
    }
  } else { S.wrong[id] = 0; save("wrong"); note = "Câu này đã vào sổ câu sai."; }
  return note;
}
function progress(ls) {
  let t = 0, d = 0;
  ls.forEach(l => [[l.quiz, S.ok], [l.practice, S.done], [l.exercises, S.done], [l.flashcards, S.fc]]
    .forEach(([arr, m]) => (arr || []).forEach(x => { t++; if (m[x.id]) d++; })));
  return t ? Math.round(100 * d / t) : 0;
}
function randomExam(mods, n) { return shuffle(Object.keys(Q).map(k => Q[k]).filter(q => mods.indexOf(q._mod) >= 0)).slice(0, n); }
function scoreExam(qs, ans) {
  const by = {}; let right = 0;
  qs.forEach(q => {
    const ok = isRight(q, ans[q.id]), m = by[q._mod] || (by[q._mod] = [0, 0]);
    m[1]++; if (ok) { m[0]++; right++; }
  });
  return {right, total: qs.length, by};
}

    if (a.ended || a.currentTime < 3) delete mem.pos[l.id]; else mem.pos[l.id] = Math.round(a.currentTime);

      <h2 class="sc-h">${esc(c.h)}</h2>
      <div class="sc-body"><ul class="sc-pts">${(c.points || []).map(p => `<li><span>${esc(p)}</span></li>`).join("")}</ul>${img ? `<figure class="sc-img"><img alt="${esc(capOf(c.img))}" src="${img}"></figure>` : ""}</div>`;

    $$(".sc-pts li", scene).forEach((li, j) => { li.classList.toggle("on", j <= k); li.classList.toggle("now", j === k); });

    tm.textContent = `${fmt(t)} / ${fmt(L.dur)}`;
    if (!a.paused && !a.seeking && t > last && t - last < 2) {

  go.onclick = skip.onclick = closePop;

    const s = mem.pos[l.id] || 0, resume = s > 5 && s < L.dur - 5;

    cover.innerHTML = `<button class="btn primary big" data-act="${resume ? "resume" : "restart"}">${ic("play")}${resume ? `Nghe tiếp từ ${fmt(s)}` : `Nghe bài · ${Math.max(1, Math.round(L.dur / 60))} phút`}</button>
      ${resume ? '<button class="btn" data-act="restart">Nghe từ đầu</button>' : `<p class="small">Giọng đọc giảng từng ý, tự dừng ở ${asks.length} chỗ để bạn trả lời câu hỏi.</p>`}`;

      <div class="row"><a class="btn primary" href="#/${esc(l.id)}/quiz">Làm trắc nghiệm</a><a class="btn" href="#/${esc(l.id)}/flashcards">Ôn flashcard</a>
      ${next ? `<a class="btn" href="#/${esc(next.id)}${next.listen ? "/listen" : ""}">Bài tiếp: ${esc(next.id)}</a>` : ""}<button class="btn" data-act="restart">Nghe lại</button></div>`;
  };

    else if (act === "pp") a.paused ? play() : a.pause();

    else if (act === "next") { if (i + 1 < ch.length) jump(ch[i + 1].start); }

  seek.oninput = () => { dragging = true; tm.textContent = `${fmt(+seek.value)} / ${fmt(L.dur)}`; };
  seek.onchange = () => { dragging = false; jump(+seek.value); };
  keyHandler = e => {
    if (popOpen) { if (e.key === "Escape") closePop(); return; }
    if (e.target.closest && e.target.closest("input,select,textarea,button,a")) return;

  };
  cleanup.push(() => { cancelAnimationFrame(raf); a.onpause = a.onerror = null; if (!a.paused) { a.pause(); remember(); } a.removeAttribute("src"); a.load(); });
  startCover();
}

/* ---------- bài tập tương tác: sort (kéo vào nhóm / ghép cặp), order (sắp xếp), choice (1 hoặc nhiều đáp án) ---------- */
const chipHtml = (t, i) => `<button type="button" class="chip" data-i="${i}" aria-pressed="false"><span class="tx">${esc(t)}</span></button>`;

let dragEnded = 0;

// trả true nếu cú bấm thuộc phần làm bài tương tác
function autoClick(e) {

  if (c) {

function autoCheck(card, x) {

  let miss = 0;
  secs.forEach(sec => {
    const p = x.auto.parts[+sec.dataset.k];
    if (p.kind === "sort") miss += $$(".pool .chip", sec).length;
    else if (p.kind === "choice" && !$(".opt[aria-pressed=true]", sec)) miss++;
  });
  if (miss) { res.className = "exres bad"; res.textContent = `Còn ${miss} chỗ chưa làm. Làm hết rồi bấm Kiểm tra.`; return; }
  let right = 0, total = 0;
  const fix = (el, s) => el.insertAdjacentHTML("beforeend", `<small class="fix">${s}</small>`);
  secs.forEach(sec => {
    const p = x.auto.parts[+sec.dataset.k], why = $(".pwhy", sec);
    if (p.kind === "sort") {
      $$(".bin .chip", sec).forEach(c => {
        const it = p.items[+c.dataset.i], ok = it.a.indexOf(+c.closest(".bin").dataset.bin) >= 0;
        total++; if (ok) right++;
        c.classList.add(ok ? "right" : "wrong");
        if (!ok) fix(c, `Đúng: ${it.a.map(j => esc(p.bins[j])).join(" hoặc ")}${it.why ? ". " + esc(it.why) : ""}`);
      });

        if (!ok) fix(li, `Vị trí đúng: ${+li.dataset.i + 1}`);
      });
    } else {
      const pick = $$(".opt[aria-pressed=true]", sec).map(b => +b.dataset.o), ok = pick.length === p.answer.length && p.answer.every(a => pick.indexOf(a) >= 0);
      total++; if (ok) right++;
      $$(".opt", sec).forEach(b => {
        const j = +b.dataset.o, isA = p.answer.indexOf(j) >= 0, isP = pick.indexOf(j) >= 0;
        if (isA) { b.classList.add("right"); $(".st", b).innerHTML = `${ic("check")}${isP ? "Đúng" : "Đáp án đúng, bạn chưa chọn"}`; }
        else if (isP) { b.classList.add("wrong"); $(".st", b).innerHTML = `${ic("x")}Bạn chọn · sai`; }

  res.className = "exres " + (all ? "ok" : "bad");
  res.textContent = all ? `Đúng hết ${right}/${total}. Bài đã tính vào tiến độ.` : `Đúng ${right}/${total}. Chỗ sai tô đỏ kèm đáp án đúng. Bấm "Sửa chỗ sai" để làm lại phần sai.`;
  if (all) {
    S.done[x.id] = 1; S.grade[x.id] = "ok"; save("done"); save("grade");
    card.classList.add("done");
  }
}
function autoRedo(card, x) {
  const all = card.classList.contains("allok");

  $$(".pwhy", card).forEach(w => { w.hidden = true; });
  $$(".part", card).forEach(sec => {

// kéo thả bằng pointer events: chuột kéo ngay, cảm ứng giữ 0,2 giây rồi kéo (chạm nhanh vẫn để cuộn trang)
function dragSetup(root) {
  let st = null;
  const end = drop => {
    if (!st) return;
    clearTimeout(st.timer);
    if (st.active) {
      if (drop && st.el.classList.contains("chip")) {
        const g = st.ghost; g.hidden = true;
        const dz = (document.elementFromPoint(drop.x, drop.y) || document.body).closest(".bin, .pool");
        if (dz && dz.closest(".part") === st.sec) moveChip(st.el, dz);
      }
      st.ghost.remove(); st.el.classList.remove("dragging");
      $$(".over", st.sec).forEach(z => z.classList.remove("over"));
      dragEnded = Date.now();
    }
    st = null;
  };
  const begin = (x, y) => {
    const r = st.el.getBoundingClientRect(), g = st.el.cloneNode(true);
    g.classList.add("drag-ghost"); g.removeAttribute("data-i"); g.style.width = r.width + "px";
    st.dx = x - r.left; st.dy = y - r.top; st.ghost = g; st.active = true;
    g.style.left = r.left + "px"; g.style.top = r.top + "px";
    document.body.appendChild(g); st.el.classList.add("dragging");
    if (st.el.classList.contains("chip")) selChip(st.sec, null);
  };
  root.addEventListener("pointerdown", e => {
    const it = e.target.closest(".chip, .oi");
    if (!it || e.button > 0 || e.target.closest("[data-mv]") || it.closest(".ex").classList.contains("locked")) return;
    st = {el: it, sec: it.closest(".part"), x0: e.clientX, y0: e.clientY, touch: e.pointerType !== "mouse", active: false};
    if (st.touch) st.timer = setTimeout(() => { if (st && !st.active) { begin(st.x0, st.y0); if (navigator.vibrate) navigator.vibrate(10); } }, 200);
  });
  const move = e => {
    if (!st) return;
    const dist = Math.hypot(e.clientX - st.x0, e.clientY - st.y0);
    if (!st.active) {
      if (st.touch) { if (dist > 8) end(); return; }
      if (dist < 5) return;
      begin(st.x0, st.y0);
    }
    st.ghost.style.left = e.clientX - st.dx + "px"; st.ghost.style.top = e.clientY - st.dy + "px";
    if (e.clientY < 70) scrollBy(0, -14); else if (e.clientY > innerHeight - 70) scrollBy(0, 14);
    if (st.el.classList.contains("chip")) {
      st.ghost.hidden = true;
      const dz = (document.elementFromPoint(e.clientX, e.clientY) || document.body).closest(".bin, .pool");
      st.ghost.hidden = false;
      $$(".over", st.sec).forEach(z => { if (z !== dz) z.classList.remove("over"); });
      if (dz && dz.closest(".part") === st.sec) dz.classList.add("over");
    } else {
      const ol = st.el.parentNode, sib = $$(".oi", ol).filter(li => li !== st.el);
      const nxt = sib.find(li => { const r = li.getBoundingClientRect(); return e.clientY < r.top + r.height / 2; });
      if (nxt) { if (st.el.nextElementSibling !== nxt) ol.insertBefore(st.el, nxt); } else if (ol.lastElementChild !== st.el) ol.appendChild(st.el);
    }
  };
  const onUp = e => end({x: e.clientX, y: e.clientY}), onCancel = () => end();
  const noScroll = e => { if (st && st.active) e.preventDefault(); };
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", onUp);
  window.addEventListener("pointercancel", onCancel);
  document.addEventListener("touchmove", noScroll, {passive: false});
  root.addEventListener("contextmenu", e => { if (e.target.closest(".chip, .oi")) e.preventDefault(); });
  root.addEventListener("keydown", e => {
    if ((e.key === "Enter" || e.key === " ") && e.target.matches(".bin, .pool")) { e.preventDefault(); e.target.click(); }
  });
  cleanup.push(() => {
    window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", onUp);
    window.removeEventListener("pointercancel", onCancel); document.removeEventListener("touchmove", noScroll);
    if (st && st.ghost) st.ghost.remove();
  });
}

    <div class="row">
      ${hints.length ? `<button class="btn" data-act="hint">${ic("bulb")}<span>Xem gợi ý 1/${hints.length}</span></button>` : ""}
      <button class="btn primary" data-act="submit" aria-expanded="false">${ic("eye")}<span>Nộp và so đáp án</span></button>
      <span class="gstat">${gradeHtml(x.id)}</span>
    </div>

      <div class="cmp-mine"><p class="lbl">Bài làm của bạn</p><div class="mine"></div></div>
      <div class="answer prose"><p class="lbl">Đáp án mẫu</p>${x.answer || ""}</div>
      <div class="selfg"><p class="lbl">So với đáp án mẫu, bạn tự chấm bài mình:</p>
        <div class="row">${Object.keys(GRADE).map(g => `<button class="btn g-${g}" data-act="grade" data-g="${g}" aria-pressed="${S.grade[x.id] === g}">${GRADE[g]}</button>`).join("")}</div>
        <p class="gnote small" aria-live="polite">${S.grade[x.id] ? GRADE_NOTE[S.grade[x.id]] : ""}</p></div>
    </div>`}
    ${src(x.src)}</article>`;
  }).join("");
  enhance(el);
  // lưu nháp: ghi thẳng localStorage (không vẽ lại thanh bên mỗi lần gõ phím)
  let tmr = 0;
  el.oninput = e => {
    const ta = e.target; if (ta.tagName !== "TEXTAREA") return;
    const card = ta.closest(".ex"), id = card.dataset.id;
    clearTimeout(tmr);
    tmr = setTimeout(() => {
      if (ta.value.trim()) S.draft[id] = ta.value; else delete S.draft[id];
      try { localStorage.setItem("itba:v1:draft", JSON.stringify(S.draft)); $(".saved", card).textContent = "· đã lưu"; } catch (err) { $(".saved", card).textContent = "· không lưu được trên trình duyệt này"; }
    }, 400);
  };
  const byId = Object.create(null); items.forEach(x => { byId[x.id] = x; });
  dragSetup(el);
  el.onclick = e => {
    if (autoClick(e, byId)) return;
    const b = e.target.closest("button[data-act]"); if (!b) return;
    const card = b.closest(".ex"), id = card.dataset.id, act = b.dataset.act;
    if (act === "check") autoCheck(card, byId[id]);
    else if (act === "redo") autoRedo(card, byId[id]);
    else if (act === "submit") {
      const c = $(".cmp", card), show = c.hidden, v = $("textarea", card).value.trim();
      if (show) {
        const m = $(".mine", card);
        m.textContent = v || "Bạn chưa viết gì. Vẫn có thể so đáp án rồi tự chấm.";

      c.hidden = !show; b.setAttribute("aria-expanded", show); $("span", b).textContent = show ? "Ẩn đáp án" : "Nộp và so đáp án";

      const g = b.dataset.g;

      const hs = $$(".hint", card), k = hs.findIndex(h => h.hidden);
      if (k < 0) return;
      hs[k].hidden = false;
      if (k + 1 < hs.length) $("span", b).textContent = `Xem gợi ý ${k + 2}/${hs.length}`;
      else { b.remove(); hs[k].focus(); }
    } else if (act === "ans") {
      const a = $(".answer", card), show = a.hidden;
      a.hidden = !show; b.setAttribute("aria-expanded", show); $("span", b).textContent = show ? "Ẩn đáp án mẫu" : "Xem đáp án mẫu";
    } else if (act === "done") {
      if (S.done[id]) delete S.done[id]; else S.done[id] = 1;
      save("done");
      const d = !!S.done[id];
      b.setAttribute("aria-pressed", d); $("span", b).textContent = d ? "Đã làm" : "Đánh dấu đã làm"; card.classList.toggle("done", d);
    }
  };
}

/* flashcard: chỉ vẽ 1 thẻ mỗi lần nên bộ 400 thẻ vẫn nhẹ */
function flashView(el, cards, showLesson) {
  if (!cards.length) return empty(el, "Chưa có flashcard.");
  let deck = cards.slice(), i = 0, back = false, only = false;
  el.innerHTML = `<div class="row"><button class="btn" data-act="shuffle">${ic("shuffle")}Xáo thẻ</button><button class="btn" data-act="only" aria-pressed="false">${ic("filter")}Chỉ thẻ chưa thuộc</button></div>
  <div class="fc-stat"><span class="small tnum" aria-live="polite"></span><div class="pbar" aria-hidden="true"><span></span></div></div>
  <div class="fc-stage"><div class="fc-card" aria-live="polite"></div></div>
  <div class="fc-nav"><button class="btn" data-act="prev" aria-label="Thẻ trước">${ic("left")}</button>
  <div class="mid"><button class="btn bad" data-act="unknown">${ic("x")}Chưa thuộc</button><button class="btn primary" data-act="flip">${ic("flip")}Lật thẻ</button><button class="btn ok" data-act="known">${ic("check")}Đã thuộc</button></div>
  <button class="btn" data-act="next" aria-label="Thẻ sau">${ic("right")}</button></div>
  <p class="kbd"><kbd>Space</kbd> lật thẻ · <kbd>←</kbd> <kbd>→</kbd> chuyển thẻ · bấm vào thẻ cũng lật được</p>`;
  const list = () => only ? deck.filter(c => !S.fc[c.id]) : deck;
  function draw() {
    const L = list(), card = $(".fc-card", el), known = deck.filter(c => S.fc[c.id]).length;
    if (i >= L.length) i = 0;
    $(".fc-stat span", el).textContent = `Thẻ ${L.length ? i + 1 : 0}/${L.length} · Đã thuộc ${known}/${deck.length}`;
    $(".fc-stat .pbar span", el).style.width = (deck.length ? 100 * known / deck.length : 0) + "%";
    card.classList.remove("flipped");
    if (!L.length) { card.innerHTML = '<div class="fc-face"><p class="fc-front-txt">Đã thuộc hết các thẻ</p><p class="fc-hint">Tắt lọc “Chỉ thẻ chưa thuộc” để ôn lại.</p></div>'; return; }
    const c = L[i], tag = `<span>${showLesson && c._lid ? esc(c._lid) : ""}${S.fc[c.id] ? (showLesson && c._lid ? " · " : "") + "Đã thuộc" : ""}</span>`;
    card.innerHTML = `<div class="fc-face fc-front"><p class="lbl"><span>Mặt trước</span>${tag}</p><p class="fc-front-txt">${esc(c.front)}</p><p class="fc-hint">Bấm để lật</p></div>
    <div class="fc-face fc-back" aria-hidden="true"><p class="lbl"><span>Mặt sau</span>${tag}</p><div class="prose">${c.back || ""}</div></div>`;
    enhance(card);
    if (back) setFace(true);
  }
  function setFace(b) {
    const card = $(".fc-card", el), f = $(".fc-front", card), k = $(".fc-back", card);
    back = b; card.classList.toggle("flipped", b);
    if (f && k) { f.setAttribute("aria-hidden", b); k.setAttribute("aria-hidden", !b); }
  }
  const flip = () => setFace(!back);
  const go = d => { const n = list().length; if (n) { i = (i + d + n) % n; back = false; draw(); } };
  el.onclick = e => {
    if (e.target.closest(".fc-card")) return flip();
    const b = e.target.closest("button[data-act]"); if (!b) return;
    const a = b.dataset.act;
    if (a === "flip") flip();
    else if (a === "prev") go(-1);
    else if (a === "next") go(1);
    else if (a === "shuffle") { deck = shuffle(deck); i = 0; back = false; draw(); }
    else if (a === "only") { only = !only; b.setAttribute("aria-pressed", only); i = 0; back = false; draw(); }
    else {
      const L = list(); if (!L.length) return;
      if (a === "known") S.fc[L[i].id] = 1; else delete S.fc[L[i].id];
      save("fc");
      back = false;
      if (!(only && a === "known")) i = (i + 1) % L.length; // thẻ vừa thuộc rời danh sách lọc nên i đã trỏ thẻ kế
      draw();
    }
  };
  keyHandler = e => {
    const tag = e.target.tagName;
    if (/^(INPUT|SELECT|TEXTAREA)$/.test(tag) || e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === " " && tag !== "BUTTON" && tag !== "A") { e.preventDefault(); flip(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(-1); }
    else if (e.key === "ArrowRight") { e.preventDefault(); go(1); }
  };
  draw();
}

function viewFlash(v, mod) {
  if (mod && !MOD_BY[mod]) mod = "";
  v.innerHTML = `<h1 tabindex="-1">Flashcard</h1>
  <label class="field">Phạm vi <select id="scope"><option value="">Toàn khóa</option>${MODS.map(m => `<option value="${esc(m.id)}"${m.id === mod ? " selected" : ""}>${esc(m.id)} · ${esc(m.title)}</option>`).join("")}</select></label>

}

/* ---------- trắc nghiệm ---------- */
function qCard(q, n, mode) {
  const opts = q.type === "tf" ? q.options : shuffle(q.options || []);
  return `<article class="q" data-qid="${esc(q.id)}">
  <p class="qhead"><b>Câu ${n}</b><span class="tag">${TYPE[q.type] || ""}</span><span class="tag lv-${esc(q.level)}">${LEVEL[q.level] || ""}</span>${q._lid ? `<span class="tag">${esc(q._lid)}</span>` : ""}</p>
  <div class="prose">${q.q || ""}</div>
  ${q.type === "multi" ? `<p class="muted small">Chọn tất cả phương án đúng${mode === "practice" ? " rồi bấm “Kiểm tra”" : ""}.</p>` : ""}
  <div role="group" aria-label="Phương án câu ${n}">${opts.map((o, i) => `<button class="opt" data-o="${esc(o.id)}" aria-pressed="false"><span class="mk" aria-hidden="true">${"ABCDEFG"[i]}</span><span class="ot">${esc(o.t)}</span><span class="st"></span></button>`).join("")}</div>
  ${q.type === "multi" && mode === "practice" ? '<button class="btn primary" data-act="check">Kiểm tra</button>' : ""}
  <div class="fb" tabindex="-1" hidden></div></article>`;
}

function markCard(card, q, chosen, note) {
  chosen = chosen || [];
  const ok = isRight(q, chosen), ww = q.why_wrong || {}, rows = [];
  card.classList.add(ok ? "is-ok" : "is-bad");
  $$(".opt", card).forEach(b => {
    const id = b.dataset.o, right = (q.answer || []).indexOf(id) >= 0, pick = chosen.indexOf(id) >= 0;
    b.disabled = true;
    if (right) b.classList.add("right"); else if (pick) b.classList.add("wrong");
    $(".st", b).innerHTML = right ? ic("check") + (pick ? "Bạn chọn · đúng" : "Đáp án đúng") : (pick ? ic("x") + "Bạn chọn · sai" : "");
    if (!right && ww[id]) rows.push(`<li><b>${esc($(".mk", b).textContent)}. ${esc($(".ot", b).textContent)}</b> – ${esc(ww[id])}</li>`);
  });
  const ck = $("[data-act=check]", card); if (ck) ck.remove();
  const fb = $(".fb", card);
  fb.hidden = false;
  fb.innerHTML = `<p class="verdict">${ok ? ic("check") + "Chính xác" : ic("x") + (chosen.length ? "Chưa đúng" : "Chưa trả lời")}</p>
  <div class="prose">${q.explain || ""}</div>
  ${rows.length ? `<p class="lbl">Vì sao các phương án khác sai</p><ul class="why">${rows.join("")}</ul>` : ""}
  ${src(q.src)}${note ? `<p class="note2">${esc(note)}</p>` : ""}`;
  enhance(fb);
}

// mode "practice": chấm ngay; "exam": chỉ ghi lựa chọn. Trả về object lựa chọn {qid: [optionId]}
function runQuiz(box, qs, mode, onAnswer) {
  const ans = {}, graded = {};
  box.innerHTML = qs.map((q, i) => qCard(q, i + 1, mode)).join("");
  enhance(box);
  box.onclick = e => {
    const b = e.target.closest("button"); if (!b || b.disabled) return;
    const card = b.closest(".q"); if (!card) return;
    const q = Q[card.dataset.qid], id = q.id;
    if (graded[id]) return;
    const grade = () => {
      graded[id] = true;
      const ok = isRight(q, ans[id]);
      markCard(card, q, ans[id], record(id, ok));
      $(".fb", card).focus();
      onAnswer(id, ok);
    };
    if (b.dataset.act === "check") {
      if ((ans[id] || []).length) return grade();
      const fb = $(".fb", card); fb.hidden = false; fb.innerHTML = `<p class="msg">${ic("x")}Hãy chọn ít nhất một phương án.</p>`; return;
    }
    const o = b.dataset.o; if (o == null) return;
    if (q.type === "multi") {
      const a = ans[id] || (ans[id] = []), k = a.indexOf(o);
      if (k >= 0) a.splice(k, 1); else a.push(o);
      b.setAttribute("aria-pressed", k < 0);
    } else {
      ans[id] = [o];
      $$(".opt", card).forEach(x => x.setAttribute("aria-pressed", x === b));
      if (mode === "practice") return grade();
    }
    if (mode === "exam") onAnswer(id);
  };
  return ans;
}

function practiceView(el, qs, emptyMsg) {
  if (!qs.length) return empty(el, emptyMsg || "Chưa có câu hỏi.");
  el.innerHTML = `<div class="qbar"><p class="score" aria-live="polite"></p><div class="row"><button class="btn" data-act="redo">Làm lại</button><button class="btn" data-act="wrongonly">Chỉ làm câu sai</button></div></div><div class="qs"></div>`;
  const box = $(".qs", el), score = $(".score", el), wb = $("[data-act=wrongonly]", el);
  let cur = qs, res = {};
  const upd = () => {
    const vals = Object.keys(res).map(k => res[k]), r = vals.filter(Boolean).length;
    score.textContent = vals.length === cur.length ? `Hoàn thành: đúng ${r}/${cur.length} câu (${Math.round(100 * r / cur.length)}%).`
      : `Đã làm ${vals.length}/${cur.length} · Đúng ${r}`;
    wb.disabled = !vals.some(x => !x);
  };
  const start = list => { cur = list; res = {}; runQuiz(box, cur, "practice", (id, ok) => { res[id] = ok; upd(); }); upd(); el.scrollIntoView(); };
  $("[data-act=redo]", el).onclick = () => start(qs);
  wb.onclick = () => start(cur.filter(q => res[q.id] === false));
  cur = qs; runQuiz(box, cur, "practice", (id, ok) => { res[id] = ok; upd(); }); upd();
}

function viewWrong(v) {

  <p>Hiện có <b>${qs.length}</b> câu.</p><div id="wb"></div>`;
  practiceView($("#wb", v), qs, "Sổ trống – chưa có câu sai nào.");
}

function viewExam(v, id) {

  }

  if (!e) { v.innerHTML = '<h1 tabindex="-1">Không có đề này</h1><p><a href="#/exam">Về danh sách đề</a></p>'; return; }

function startExam(v, qs, title, minutes, key) {
  cleanup.forEach(f => f()); cleanup = [];
  v.innerHTML = `<p class="crumb"><a href="#/exam">Luyện đề</a></p><h1 tabindex="-1">${esc(title)}</h1>
  <div class="exambar"><span class="timer" role="timer" aria-label="Thời gian còn lại"></span><span class="answered small"></span><button class="btn primary" data-act="submit">Nộp bài</button></div>
  <div class="qs"></div><div class="row"><button class="btn primary" data-act="submit">Nộp bài</button></div>`;
  const box = $(".qs", v), end = Date.now() + minutes * 60000;
  const count = () => Object.keys(ans).filter(k => ans[k].length).length;
  const upd = () => { $(".answered", v).textContent = `Đã trả lời ${count()}/${qs.length}`; };
  const ans = runQuiz(box, qs, "exam", upd);
  upd();
  guard = location.hash;
  const tick = () => {
    const left = Math.max(0, end - Date.now()), s = Math.ceil(left / 1000), t = $(".timer", v);
    t.innerHTML = `${ic("clock")}${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}${s <= 300 ? " · sắp hết giờ" : ""}`;
    t.classList.toggle("low", s <= 300);
    if (!left) submit(true);
  };
  const timer = setInterval(tick, 1000);
  cleanup.push(() => clearInterval(timer));
  tick();
  function submit(auto) {
    const miss = qs.length - count();
    if (!auto && !confirm(miss ? `Còn ${miss} câu chưa trả lời. Vẫn nộp bài?` : "Nộp bài?")) return;
    clearInterval(timer); guard = null;
    const r = scoreExam(qs, ans), pct = Math.round(100 * r.right / (r.total || 1));
    qs.forEach(q => { if ((ans[q.id] || []).length) record(q.id, isRight(q, ans[q.id])); });
    if (!(S.best[key] >= pct)) { S.best[key] = pct; save("best"); }
    $$(".q", box).forEach(c => markCard(c, Q[c.dataset.qid], ans[c.dataset.qid]));
    box.onclick = null;
    $(".exambar", v).remove(); $$("[data-act=submit]", v).forEach(b => b.closest(".row").remove());
    const res = document.createElement("section");
    res.className = "card"; res.tabIndex = -1;
    res.innerHTML = `<h2>Kết quả${auto ? " – hết giờ, bài đã tự nộp" : ""}</h2>
    <p class="big">${r.right}/${r.total} câu đúng · ${pct}%</p><p class="muted">Điểm cao nhất của đề này: ${S.best[key]}%</p>
    <div class="prose"><table><thead><tr><th>Module</th><th>Đúng</th><th>Tỉ lệ</th></tr></thead><tbody>${Object.keys(r.by).sort().map(m =>
      `<tr><td>${esc(m)} · ${esc((MOD_BY[m] || {}).title)}</td><td>${r.by[m][0]}/${r.by[m][1]}</td><td>${Math.round(100 * r.by[m][0] / r.by[m][1])}%</td></tr>`).join("")}</tbody></table></div>
    <div class="row"><button class="btn" data-act="onlywrong" aria-pressed="false">Chỉ xem câu sai</button><button class="btn" data-act="again">Làm lại đề này</button><a class="btn" href="#/exam">Về danh sách đề</a></div>`;
    box.parentNode.insertBefore(res, box);
    enhance(res);
    res.focus(); res.scrollIntoView();
  }
  v.onclick = e => {
    const b = e.target.closest("button[data-act]"); if (!b) return;
    if (b.dataset.act === "submit") submit(false);
    else if (b.dataset.act === "onlywrong") { const on = box.classList.toggle("only-wrong"); b.setAttribute("aria-pressed", on); }
    else if (b.dataset.act === "again") { startExam(v, qs, title, minutes, key); $("h1", v).focus(); window.scrollTo(0, 0); }
  };
}

/* ---------- trang chung ---------- */
function viewGlossary(v) {
  const g = (C.glossary || []).slice().sort((a, b) => String(a.term || "").localeCompare(String(b.term || ""), "vi"));
  v.innerHTML = `<h1 tabindex="-1">Thuật ngữ</h1>
  <label class="field">Lọc <input type="search" id="gq" placeholder="Gõ thuật ngữ, nghĩa… (không cần dấu)" autocomplete="off"></label>
  <p class="muted small" id="gn" aria-live="polite"></p>
  <dl class="gl">${g.map(x => `<div class="gi" data-k="${esc(fold([x.term, x.vi, x.def].join(" ")))}"><dt>${LBY[x.lesson] ? `<a href="#/${esc(x.lesson)}/theory">${esc(x.term)}</a>` : esc(x.term)}${x.vi ? ` <span class="vi">– ${esc(x.vi)}</span>` : ""}</dt><dd>${esc(x.def)} <span class="muted small">(${esc(x.lesson)})</span></dd></div>`).join("")}</dl>`;
  const items = $$(".gi", v), inp = $("#gq", v), n = $("#gn", v);
  const f = () => {
    const k = fold(inp.value.trim()); let c = 0;
    items.forEach(it => { const show = !k || it.dataset.k.indexOf(k) >= 0; it.hidden = !show; if (show) c++; });
    n.textContent = `${c}/${items.length} thuật ngữ`;
  };
  inp.oninput = f; f();
}

function viewSummary(v) {
  v.innerHTML = `<h1 tabindex="-1">Tổng kết khóa</h1><div class="prose">${C.course_summary_html || '<p class="muted">Chưa có.</p>'}</div>
  <h2>Tổng kết từng module</h2><ul>${MODS.map(m => `<li><a href="#/${esc(m.id)}">${esc(m.id)} · ${esc(m.title)}</a></li>`).join("")}</ul>`;
  enhance(v);
}

function viewCase(v) {
  const cs = C.case_study || {};
  v.innerHTML = `<h1 tabindex="-1">Case study${cs.title ? ": " + esc(cs.title) : ""}</h1><div class="prose">${cs.html || '<p class="muted">Chưa có.</p>'}</div>
  <h2>Bài tập tổng hợp</h2><div id="csx"></div>`;
  enhance(v);
  exList($("#csx", v), cs.exercises || [], false);
}

function route() {
  cleanup.forEach(f => f()); cleanup = []; keyHandler = null; guard = null;
  document.body.classList.remove("nav-open"); $("#navbtn").setAttribute("aria-expanded", "false");
  const [a, b] = location.hash.replace(/^#\/?/, "").split("/").map(s => { try { return decodeURIComponent(s); } catch (e) { return s; } });
  const main = $("#main"), v = document.createElement("div");
  v.className = "wrap"; main.innerHTML = ""; main.appendChild(v);
  try {
    if (!a) viewHome(v);
    else if (LBY[a]) viewLesson(v, LBY[a], b);
    else if (MOD_OF[a]) viewMissing(v, a);
    else if (MOD_BY[a]) viewModule(v, MOD_BY[a]);
    else if (a === "flash") viewFlash(v, b);
    else if (a === "exam") b ? viewExam(v, b) : viewExamList(v);
    else if (a === "wrong") viewWrong(v);
    else if (a === "glossary") viewGlossary(v);
    else if (a === "summary") viewSummary(v);
    else if (a === "case") viewCase(v);
    else v.innerHTML = '<h1 tabindex="-1">Không tìm thấy trang</h1><p><a href="#/">Về trang chủ</a></p>';
  } catch (err) {
    console.error(err);
    v.innerHTML = `<h1 tabindex="-1">Lỗi hiển thị</h1><p>${esc(err && err.message)}</p><p><a href="#/">Về trang chủ</a></p>`;
  }
  renderSide();
  const h = $("h1", v), t = h ? h.textContent : "";
  document.title = (t && a ? t + " – " : "") + (C.title || "Khóa học");
  $("#toptitle").textContent = t;
  window.scrollTo(0, 0);
  if (h && !firstRoute) h.focus();
  firstRoute = false;
}

function boot() {
  onSave = renderSide;
  const nav = open => { document.body.classList.toggle("nav-open", open); $("#navbtn").setAttribute("aria-expanded", open); if (open) { const x = $("#side a"); if (x) x.focus(); } };
  $("#navbtn").onclick = () => nav(!document.body.classList.contains("nav-open"));
  $("#scrim").onclick = () => nav(false);
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && document.body.classList.contains("nav-open")) { nav(false); $("#navbtn").focus(); return; }
    if (keyHandler) keyHandler(e);
  });
  window.addEventListener("hashchange", () => {
    if (guard && location.hash !== guard) {
      if (!confirm("Bài thi đang làm sẽ bị hủy. Vẫn rời trang?")) { try { history.replaceState(null, "", guard); } catch (e) {} return; }
      guard = null;
    }
    route();
  });
  window.addEventListener("beforeunload", e => { if (guard) { e.preventDefault(); e.returnValue = ""; } });
  route();
}
if (typeof document !== "undefined") boot();
</script>
